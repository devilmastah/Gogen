name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install tools + cross-compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep gcc-aarch64-linux-gnu
      - name: Build linux/amd64
        run: GOOS=linux GOARCH=amd64 go build -o gogen-linux-amd64 -ldflags="-s -w" .
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: Tidy
        run: go mod tidy -diff
      - name: Test
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee go-test.log
      # A failing test names itself on stdout, but reading a job log needs
      # repository admin: a pull request's author (or a fork) cannot see it.
      # Re-emit the failure lines as annotations, which the checks API serves
      # to anyone. The Windows job does the same.
      - name: Report failing tests
        if: failure()
        run: |
          test -f go-test.log || exit 0
          grep -A2 -E '^--- FAIL' go-test.log | head -30 | while IFS= read -r line; do
            echo "::error title=go test::$(printf '%s' "$line" | tr -d '\r')"
          done
      # Debug-tagged sources (view-drift, profiling, WS stall knobs) only
      # compile under -tags debug, so this re-run is the sole CI signal that
      # they still build and pass. Keep it Linux-only: the normal Test step
      # already runs -race here, and the macOS/Windows jobs skip -race (see
      # their Test step), so the agent/server/profiling suites would otherwise
      # be compiled and run a third time for no extra coverage.
      - name: Test debug tags (Linux only)
        if: runner.os == 'Linux'
        run: go test -race -tags debug ./internal/agent/ ./internal/profiling/ ./internal/server/
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go tool staticcheck ./...
      - name: Vulncheck
        run: go tool govulncheck ./...
      - name: Build without CGO
        run: CGO_ENABLED=0 go build -o gogen-nocgo .
      - name: Build linux/arm64
        run: CC=aarch64-linux-gnu-gcc GOOS=linux GOARCH=arm64 go build -o gogen-linux-arm64 -ldflags="-s -w" .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web and sidebar script checks
        run: |
          node scripts/lint-web.js
          make test-vscode

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install ripgrep
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: which rg >/dev/null 2>&1 || brew install ripgrep
      - name: Build darwin/amd64
        run: GOOS=darwin GOARCH=amd64 go build -o gogen-darwin-amd64 -ldflags="-s -w" .
      - name: Build darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go build -o gogen-darwin-arm64 -ldflags="-s -w" .
      - name: Test
        # The race detector adds ~2min here (almost all in internal/agent's
        # tokenizer-heavy compaction tests) and buys little: the Linux job
        # already runs the full -race suite. This job therefore runs the
        # detector-free suite; Linux remains the single -race gate.
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install mingw + ripgrep
        run: choco install mingw ripgrep -y
      - name: Build windows/amd64
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=1 go build -o gogen-windows-amd64.exe -ldflags="-s -w" .
      - name: Test
        env:
          CGO_ENABLED: "1"
        # No -race here: the detector adds ~2min (almost all in
        # internal/agent's tokenizer-heavy compaction tests) and the Linux job
        # already runs the full -race suite, so this buys no extra coverage.
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee go-test.log
      # A failing test names itself on stdout, but reading a job log needs
      # repository admin: a pull request's author (or a fork) cannot see it, so
      # "windows is red" arrives with no test name. Re-emit the failure lines
      # as annotations, which the checks API serves to anyone.
      - name: Report failing tests
        if: failure()
        run: |
          test -f go-test.log || exit 0
          grep -A2 -E '^--- FAIL' go-test.log | head -30 | while IFS= read -r line; do
            echo "::error title=go test::$(printf '%s' "$line" | tr -d '\r')"
          done
      - name: Vet
        run: go vet ./...
